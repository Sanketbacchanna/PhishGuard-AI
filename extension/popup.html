<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PhishGuard AI</title>
    <style>
        body { width: 320px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; }
        h2 { margin-top: 0; font-size: 18px; color: #38bdf8; display: flex; align-items: center; gap: 8px;}
        .card { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .score-circle { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; margin: 0 auto 12px; border: 4px solid #334155; }
        .safe { color: #22c55e; border-color: #22c55e; }
        .suspicious { color: #f59e0b; border-color: #f59e0b; }
        .phishing { color: #ef4444; border-color: #ef4444; }
        .status-text { text-align: center; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .url-text { font-size: 12px; color: #94a3b8; word-break: break-all; margin-bottom: 12px; text-align: center;}
        ul { margin: 0; padding-left: 20px; font-size: 13px; color: #cbd5e1; }
        li { margin-bottom: 4px; }
        .footer { text-align: center; font-size: 11px; color: #64748b; margin-top: 16px; }
        .loading { text-align: center; color: #94a3b8; font-size: 14px; padding: 20px 0; }
        a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <h2>🛡️ PhishGuard AI</h2>
    
    <div class="card" id="result-card">
        <div class="loading" id="loading">Analyzing current page...</div>
        <div id="content" style="display: none;">
            <div id="score-circle" class="score-circle"></div>
            <div id="status" class="status-text"></div>
            <div id="url" class="url-text"></div>
            <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">Reasons:</div>
            <ul id="reasons-list"></ul>
        </div>
    </div>
    
    <div class="footer">
        <a href="https://phish-guard-ai-pi.vercel.app/" target="_blank">Open Dashboard ↗</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
