<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Glow -->
  <path d="M256,40 C340,40 400,75 420,165 C420,290 325,395 256,472 C187,395 92,290 92,165 C112,75 172,40 256,40 Z" fill="url(#shieldGrad)" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Outer Shield -->
  <path d="M256,50 C330,50 385,82 402,160 C402,270 318,365 256,432 C194,365 110,270 110,160 C127,82 182,50 256,50 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner Shield Fill -->
  <path d="M256,70 C315,70 360,98 375,160 C375,250 305,335 256,395 C207,335 137,250 137,160 C152,98 197,70 256,70 Z" fill="#0f172a" />
  
  <!-- AI Neural Network Nodes / Synapses -->
  <g stroke="#0ea5e9" stroke-width="4" opacity="0.6">
    <line x1="256" y1="130" x2="190" y2="190" />
    <line x1="256" y1="130" x2="322" y2="190" />
    <line x1="190" y1="190" x2="190" y2="280" />
    <line x1="322" y1="190" x2="322" y2="280" />
    <line x1="190" y1="280" x2="256" y2="340" />
    <line x1="322" y1="280" x2="256" y2="340" />
    <line x1="256" y1="130" x2="256" y2="340" />
    <line x1="190" y1="190" x2="322" y2="280" />
    <line x1="322" y1="190" x2="190" y2="280" />
  </g>
  
  <!-- Node Circles -->
  <circle cx="256" cy="130" r="16" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="190" cy="190" r="12" fill="#0ea5e9"/>
  <circle cx="322" cy="190" r="12" fill="#0ea5e9"/>
  <circle cx="190" cy="280" r="12" fill="#0ea5e9"/>
  <circle cx="322" cy="280" r="12" fill="#0ea5e9"/>
  <circle cx="256" cy="340" r="16" fill="#38bdf8" filter="url(#glow)"/>
  
  <!-- Central core checkmark / emblem -->
  <path d="M220,230 L245,255 L300,200" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>